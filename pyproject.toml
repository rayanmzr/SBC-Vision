[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sbc-vision"
version = "0.1.0"
description = "Socle de perception d'interfaces et préparation de SBC pour le projet Epitech"
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [
  {name = "Rayan Mazri"},
  {name = "Saber Kasri"},
  {name = "Samy Allali"},
]
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.9,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8,<10", "ruff>=0.9,<1"]
vision = ["opencv-python-headless>=4.10", "numpy>=2,<3", "pillow>=10"]
solver = ["ortools>=9.10,<10"]
data = ["beautifulsoup4>=4.12,<5", "httpx>=0.27,<1"]
tracking = ["mlflow>=2.17,<4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
