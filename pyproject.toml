[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sbc-vision"
version = "0.1.0"
description = "Socle de perception d'interfaces et préparation de SBC pour le projet Epitech"
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [
  {name = "Rayan Mazri"},
  {name = "Saber Kasri"},
  {name = "Samy Allali"},
]
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.9,<3",
  "uvicorn>=0.30,<1",
  "pillow>=10.4,<13",
  "python-multipart>=0.0.33,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8,<10", "ruff>=0.9,<1"]
vision = [
  "opencv-python-headless>=4.10",
  "numpy>=2,<3",
  "pillow>=10",
  "scikit-learn>=1.5,<2",
  "onnxruntime>=1.20,<2",
  "pycocotools>=2.0.8,<3",
]
# Capture de sites web au format WebUI (outil de construction des données, pas d'inférence).
capture = ["playwright>=1.48,<2"]
# Explicabilité (SHAP sur la baseline ; D-RISE n'a besoin que de `vision`).
explain = ["shap>=0.51,<1"]
solver = ["ortools>=9.10,<10"]
data = ["beautifulsoup4>=4.12,<5", "httpx>=0.27,<1"]
ocr = ["pytesseract>=0.3.13,<1", "pillow>=10.4,<13"]
tracking = ["mlflow>=2.17,<4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
