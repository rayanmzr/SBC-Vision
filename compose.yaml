services:
  api:
    image: sbc-vision:local
    build: .
    ports:
      - "127.0.0.1:${SBC_PORT:-8000}:8000"
    environment:
      SBC_ENV: development
      SBC_ACCESS_MODE: local
    volumes:
      - service-data:/app/data/processed
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 2g
    cpus: 2
    restart: unless-stopped

volumes:
  service-data:
